{% extends "utils/vendor_base.html" %}

{% block start %}

<div class="container mt-5">
    <div class="row g-3">
        {% for image in images %}
        <div class="col-6 col-md-4 col-lg-3">
            <div class="card">
                <img src="/media/{{ image.image }}" class="card-img-top img-fluid" alt="Hotel Image">
                <a href="{% url 'delete_image' image.id %}" class="btn btn-danger position-absolute top-0 end-0 m-2">Delete</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<div class ="container mt-5">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
            {% include "utils/alerts.html" %}
        <div class="mb-3">
            <label for="formFileMultiple" class="form-label">Select Hotel Images</label>
            <input class="form-control" type="file" name="image" id="formFileMultiple" multiple>
        </div>
        <button type="submit" class="btn btn-success">Upload</button>
    </form>
</div>
{% endblock %}
